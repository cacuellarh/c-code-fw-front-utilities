<main class="box">
  <cms-logo />
  <h1>Entra a tu sitio</h1>
  <p class="lead">Edita los planes, fotos y promociones de tu sitio web.</p>
  <button type="button" class="btn primary" (click)="signIn()" [disabled]="busy()">
    {{ busy() ? 'Abriendo Google…' : 'Entrar con Google' }}
  </button>
  @if (error()) {
    <p class="alert" role="alert">{{ error() }}</p>
  }
</main>
