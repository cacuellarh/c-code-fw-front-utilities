<main class="box">
  <p class="eyebrow">C-Code CMS</p>
  <h1>Entrar</h1>
  <p class="lead">Administra el contenido de los sitios de tus clientes.</p>
  <button type="button" class="btn primary" (click)="signIn()" [disabled]="busy()">
    {{ busy() ? 'Abriendo Google…' : 'Entrar con Google' }}
  </button>
  @if (error()) {
    <p class="alert" role="alert">{{ error() }}</p>
  }
</main>
