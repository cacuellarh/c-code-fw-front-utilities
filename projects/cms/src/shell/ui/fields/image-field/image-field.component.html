<div class="row">
  <div class="thumb" [class.icon]="field().kind === 'icon'">
    @if (preview.value(); as src) {
      <img [src]="src" alt="" (error)="broken.set(true)" (load)="broken.set(false)" [hidden]="broken()" />
      @if (broken()) {
        <span class="missing">No está en el sitio</span>
      }
    } @else {
      <span class="empty">Sin imagen</span>
    }
  </div>
  <div class="side">
    <input
      class="path"
      [id]="inputId()"
      type="text"
      [value]="value()"
      placeholder="/assets/images/foto.webp"
      spellcheck="false"
      (change)="broken.set(false); value.set($any($event.target).value.trim())"
    />
    <p class="note">
      Ruta de una imagen que ya está en el sitio publicado. Subir imágenes nuevas desde el CMS llegará después.
    </p>
  </div>
</div>
