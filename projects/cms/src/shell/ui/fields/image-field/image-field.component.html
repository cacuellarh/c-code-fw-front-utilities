<div class="row">
  <button
    type="button"
    class="thumb"
    [class.icon]="field().kind === 'icon'"
    [class.invalid]="invalid()"
    (click)="pickerOpen.set(true)"
    [attr.aria-label]="(value() ? 'Cambiar ' : 'Elegir ') + field().label.toLowerCase()"
  >
    @if (preview.value(); as src) {
      <img [src]="src" alt="" (error)="broken.set(true)" (load)="broken.set(false)" [hidden]="broken()" />
      @if (broken()) {
        <span class="missing">Imagen no disponible</span>
      }
    } @else if (preview.isLoading()) {
      <cc-loader size="sm" label="Cargando imagen" />
    } @else {
      <span class="empty">
        <cms-icon name="image" [size]="24" />
        Sin imagen
      </span>
    }
  </button>
  <div class="side">
    @if (name()) {
      <span class="name">{{ name() }}</span>
    } @else if (legacy() && auth.isAdmin()) {
      <span class="pill warning" title="Está fuera de la biblioteca. Impórtala desde Configuración.">Imagen antigua</span>
    }
    <div class="actions">
      <button type="button" class="btn small" [id]="inputId()" (click)="pickerOpen.set(true)">
        {{ value() ? 'Cambiar' : 'Elegir imagen' }}
      </button>
      @if (value() && !field().required) {
        <button type="button" class="btn ghost small" (click)="picked.emit(null)">Quitar</button>
      }
    </div>
  </div>
</div>

<cms-media-picker
  [(open)]="pickerOpen"
  [kind]="field().kind ?? 'photo'"
  [selectedId]="libraryId()"
  [title]="'Elegir ' + field().label.toLowerCase()"
  (picked)="choose($event)"
/>
