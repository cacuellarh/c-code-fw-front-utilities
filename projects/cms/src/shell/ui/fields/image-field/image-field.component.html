<div class="row">
  <button
    type="button"
    class="thumb"
    [class.icon]="field().kind === 'icon'"
    (click)="pickerOpen.set(true)"
    [attr.aria-label]="(value() ? 'Cambiar ' : 'Elegir ') + field().label.toLowerCase()"
  >
    @if (preview.value(); as src) {
      <img [src]="src" alt="" (error)="broken.set(true)" (load)="broken.set(false)" [hidden]="broken()" />
      @if (broken()) {
        <span class="missing">No se encuentra</span>
      }
    } @else if (preview.isLoading()) {
      <span class="empty">Cargando…</span>
    } @else {
      <span class="empty">Sin imagen</span>
    }
  </button>
  <div class="side">
    @if (name()) {
      <span class="name">{{ name() }}</span>
    } @else if (legacy()) {
      <span class="note">Imagen anterior del sitio. Elige una de la biblioteca para reemplazarla.</span>
    }
    <div class="actions">
      <button type="button" class="btn" [id]="inputId()" (click)="pickerOpen.set(true)">
        {{ value() ? 'Cambiar imagen' : 'Elegir imagen' }}
      </button>
      @if (value() && !field().required) {
        <button type="button" class="btn ghost" (click)="picked.emit(null)">Quitar</button>
      }
    </div>
  </div>
</div>

<cms-media-picker
  [(open)]="pickerOpen"
  [kind]="field().kind ?? 'photo'"
  [selectedId]="libraryId()"
  [title]="'Elegir ' + field().label.toLowerCase()"
  (picked)="choose($event)"
/>
