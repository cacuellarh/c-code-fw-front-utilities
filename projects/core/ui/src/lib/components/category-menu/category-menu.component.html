<nav class="cc-cat" [attr.aria-label]="title() || null">
  @if (title()) {
    <p class="cc-cat__title">{{ title() }}</p>
  }
  <ul class="cc-cat__list">
    @for (option of options(); track option.value) {
      <li>
        <button
          type="button"
          class="cc-cat__item"
          [class.cc-cat__item--active]="option.value === selected()"
          [attr.aria-pressed]="option.value === selected()"
          (click)="select(option.value)"
        >
          <span>{{ option.label }}</span>
          @if (option.count !== undefined && option.count !== null) {
            <span class="cc-cat__count"><span class="cc-sr-only">(</span>{{ option.count }}<span class="cc-sr-only"> planes)</span></span>
          }
        </button>
      </li>
    }
  </ul>
</nav>
