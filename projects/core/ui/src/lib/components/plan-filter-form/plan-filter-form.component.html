<form class="cc-filter" (submit)="$event.preventDefault(); submit()">
  @if (services().length) {
    <label class="cc-filter__field">
      <span>{{ serviceLabel() }}</span>
      <select (change)="onServiceChange($event)">
        <option value="-1" [selected]="serviceIndex() === -1">{{ anyLabel() }}</option>
        @for (service of services(); track $index) {
          <option [value]="$index" [selected]="serviceIndex() === $index">{{ service.name }}</option>
        }
      </select>
    </label>
  }
  @if (priceRanges().length) {
    <label class="cc-filter__field">
      <span>{{ priceLabel() }}</span>
      <select (change)="onRangeChange($event)">
        <option value="-1" [selected]="rangeIndex() === -1">{{ anyLabel() }}</option>
        @for (range of priceRanges(); track $index) {
          <option [value]="$index" [selected]="rangeIndex() === $index">{{ range.description }}</option>
        }
      </select>
    </label>
  }
  <div class="cc-filter__actions">
    @if (mode() === 'submit') {
      <button ccButton size="sm" type="submit">{{ submitLabel() }}</button>
    }
    @if (mode() === 'submit' || hasSelection()) {
      <button ccButton variant="ghost" size="sm" type="button" (click)="reset()">{{ resetLabel() }}</button>
    }
  </div>
</form>
