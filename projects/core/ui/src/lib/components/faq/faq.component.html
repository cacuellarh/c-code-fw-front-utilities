@if (title()) {
  @if (headingLevel() === 'h3') {
    <h3 class="cc-faq__title">{{ title() }}</h3>
  } @else {
    <h2 class="cc-faq__title">{{ title() }}</h2>
  }
}
<div class="cc-faq__list">
  @for (item of items(); track item.question) {
    <cc-faq-item [question]="item.question">{{ item.answer }}</cc-faq-item>
  }
  <ng-content />
</div>
